name: Release CK Quant Hedge 2026.8.1

on:
  push:
    branches:
      - main

concurrency:
  group: ck-quant-hedge-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE_NAME: ericchenghz/ck-quant-hedge
  RELEASE_TAG: hedge-2026.8.1
  APK_NAME: CK-Quant-Hedge-Android-0.1.14-debug.apk

jobs:
  release:
    if: github.repository == 'ericchegncn/CK_Quant_Hedge' && contains(github.event.head_commit.message, '[release-hedge-2026.8.1]')
    runs-on: ubuntu-latest
    env:
      # 这两个 Secret 需要在本仓库里单独配置（GitHub 的 Secret 是按仓库隔离的）：
      #   gh secret set DOCKERHUB_USERNAME --repo ericchegncn/CK_Quant_Hedge
      #   gh secret set DOCKERHUB_TOKEN    --repo ericchegncn/CK_Quant_Hedge
      # 没配置时，Docker 那两步会自动跳过，APK 与 GitHub Release 照常产出。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Build and sync Android app
        working-directory: ck_quant_ui
        run: |
          pnpm install --frozen-lockfile
          pnpm android:sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # 与 CK Quant 主仓库共用同一个 debug 签名密钥 —— 这样本 APK 可以**直接覆盖安装**
      # 在主仓库的 APK 之上（applicationId 相同、签名相同），不需要先卸载。
      - name: Restore CK Quant debug signing key
        env:
          DEBUG_KEYSTORE_B64: 
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"

      - name: Build APK
        working-directory: ck_quant_ui/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and checksum
        run: |
          cp ck_quant_ui/android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" | tee "$APK_NAME.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checksum="$(cat "$APK_NAME.sha256")"
          cp "docs/releases/$RELEASE_TAG.md" release-notes.md
          printf '\n\n## APK SHA-256\n\n`%s`\n' "$checksum" >> release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "CK Quant Hedge $RELEASE_TAG" \
              --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" \
              --title "CK Quant Hedge $RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Set up Docker Buildx
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
            ${{ env.IMAGE_NAME }}:stable
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
